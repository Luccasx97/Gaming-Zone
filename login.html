<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gaming Zone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card card-gamer p-4 text-center">
                    <img src="img/logo.png" alt="Logo" width="150" class="mx-auto mb-3">
                    <h3 class="text-neon mb-4">Acessar Conta</h3>
                    
                    <form id="form-login">
                        <div class="mb-3 text-start">
                            <label for="email" class="form-label text-light">E-mail</label>
                            <input type="email" class="form-control input-login" id="email" placeholder="Digite seu e-mail" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label for="senha" class="form-label text-light">Senha</label>
                            <input type="password" class="form-control input-login" id="senha" placeholder="Digite sua senha" required>
                        </div>
                        <button type="submit" class="btn btn-neon w-100 mb-3">Entrar</button>
                        
<a href="#" class="text-neon text-decoration-none small" id="link-cadastro">Cadastre-se</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
